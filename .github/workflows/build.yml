name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v3
    - name: Download Stockfish Engine
      run: |
        mkdir -p app/src/main/assets
        curl -L -o app/src/main/assets/stockfish https://github.com/official-stockfish/Stockfish/releases/download/sf_16/stockfish-android-armv8
        chmod +x app/src/main/assets/stockfish
    - name: Build with Gradle
      run: gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: spectral-apk
        path: app/build/outputs/apk/debug/app-debug.apk
